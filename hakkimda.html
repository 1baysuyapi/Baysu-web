<style>
.main-menu-container { z-index: 99999 !important; }
.main-menu-container.active { display: block !important; z-index: 99999 !important; }
</style>

<style id="baysu-mega-menu-css">
.main-menu-container {
    display: none;
    position: absolute !important;
    top: 100% !important;
    left: 0 !important;
    right: 0 !important;
    width: 100% !important;
    background: #0F172A !important;
    border-bottom: 3px solid #38BDF8 !important;
    box-shadow: 0 20px 50px rgba(0,0,0,0.6) !important;
    z-index: 999999 !important;
    padding: 20px 30px !important;
    box-sizing: border-box !important;
    max-height: 80vh !important;
    overflow-y: auto !important;
}

.main-menu-container.active {
    display: block !important;
}

.main-menu-container .kaplinler-menu,
.main-menu-container.active .kaplinler-menu {
    display: grid !important;
    grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)) !important;
    gap: 20px !important;
    list-style: none !important;
    padding: 0 !important;
    margin: 0 !important;
}

.main-menu-container .product-list,
.main-menu-container.active .product-list {
    display: block !important;
    background: transparent !important;
    padding: 0 !important;
    margin: 8px 0 0 0 !important;
    list-style: none !important;
}

.main-menu-container .category-item {
    background: #1E293B !important;
    border: 1px solid #334155 !important;
    border-radius: 10px !important;
    padding: 14px !important;
}

.main-menu-container .category-header h3 {
    color: #38BDF8 !important;
    font-size: 15px !important;
    margin: 0 !important;
    padding-bottom: 8px !important;
    border-bottom: 1px solid #334155 !important;
}

.main-menu-container .product-list li a {
    color: #CBD5E1 !important;
    font-size: 13px !important;
    padding: 6px 0 !important;
    display: block !important;
    text-decoration: none !important;
    transition: color 0.2s, transform 0.2s !important;
}

.main-menu-container .product-list li a:hover {
    color: #38BDF8 !important;
    transform: translateX(4px) !important;
}

.main-category-item h2 {
    display: none !important;
}
</style>

</head>
<body class="bg-gray-950 text-white font-sans" oncontextmenu="return false;" onselectstart="return false;" ondragstart="return false;">
    <nav class="flex justify-between items-center px-8 py-6 max-w-7xl mx-auto">
        <a href="index.html" class="text-2xl font-black text-indigo-500">LOGO.</a>
        <ul class="flex space-x-6 text-sm font-medium text-gray-400">
            <li><a href="index.html" class="hover:text-white transition">← Ana Sayfa</a></li>
        </ul>
    </nav>
    <main class="max-w-4xl mx-auto px-8 py-20">
        <h1 class="text-4xl md:text-6xl font-black mb-10">Ben Kimim?</h1>
        <div class="prose prose-invert lg:prose-xl text-gray-400 leading-relaxed space-y-6">
            <p>
                Buraya kendinle ilgili kısa bir hikaye yazabilirsin. Nelerle ilgileniyorsun, hangi teknolojileri seviyorsun? 
            </p>
            <p>
                GitHub üzerinde projeler geliştirmekten ve yeni şeyler öğrenmekten keyif alıyorum.
            </p>
        </div>
        <div class="mt-16">
            <h2 class="text-2xl font-bold mb-6 text-indigo-400">Yeteneklerim</h2>
            <div class="flex flex-wrap gap-3">
                <span class="bg-gray-900 border border-gray-800 px-4 py-2 rounded-full text-sm">HTML5</span>
                <span class="bg-gray-900 border border-gray-800 px-4 py-2 rounded-full text-sm">CSS3</span>
                <span class="bg-gray-900 border border-gray-800 px-4 py-2 rounded-full text-sm">Tailwind CSS</span>
                <span class="bg-gray-900 border border-gray-800 px-4 py-2 rounded-full text-sm">Git / GitHub</span>
            </div>
        </div>
    </main>
<script>
document.addEventListener('DOMContentLoaded', function() {
    var btnDesktop = document.getElementById('menuToggleDesktop');
    var btnMobile = document.getElementById('menuToggleMobile');
    var menuContainer = document.getElementById('mainMenuContainer');
    
    function toggleMenu(e) {
        if(e) e.preventDefault();
        if(menuContainer) {
            menuContainer.classList.toggle('active');
            if(menuContainer.classList.contains('active')) {
                menuContainer.style.display = 'block';
                menuContainer.style.zIndex = '99999';
            } else {
                menuContainer.style.display = 'none';
            }
        }
    }

    if(btnDesktop) {
        btnDesktop.addEventListener('click', toggleMenu);
    }
    if(btnMobile) {
        btnMobile.addEventListener('click', toggleMenu);
    }
});
</script>

<script id="baysu-mega-menu-js">
(function(){
    function initBaysuMenu() {
        var triggers = document.querySelectorAll('#menuToggleDesktop, #menuToggleMobile, .dropdown-toggle, a[href*="#products"]');
        var menu = document.getElementById('mainMenuContainer');

        if(!menu) return;

        triggers.forEach(function(btn){
            btn.addEventListener('click', function(e){
                e.preventDefault();
                e.stopPropagation();
                if(menu.classList.contains('active')) {
                    menu.classList.remove('active');
                } else {
                    menu.classList.add('active');
                }
            });
        });

        // Close menu when clicking outside
        document.addEventListener('click', function(e){
            if(menu && menu.classList.contains('active')) {
                var isClickInside = menu.contains(e.target);
                var isClickTrigger = false;
                triggers.forEach(function(btn){
                    if(btn.contains(e.target)) isClickTrigger = true;
                });

                if(!isClickInside && !isClickTrigger) {
                    menu.classList.remove('active');
                }
            }
        });
    }

    if(document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', initBaysuMenu);
    } else {
        initBaysuMenu();
    }
})();
</script>

</body>
</html>
