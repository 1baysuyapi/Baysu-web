<!DOCTYPE html>
<html>
<head>
<script>
window.onerror = function(msg, url, lineNo, columnNo, error) {
    document.body.innerHTML += "<h1 style='color:red'>JS ERROR: " + msg + " at " + lineNo + ":" + columnNo + "</h1>";
    return false;
};
</script>
<script src="data.js?v=1"></script>
<script>
try {
    if (window.PAGE_DATA) {
        document.body.innerHTML += "<h2>PAGE_DATA loaded. Keys: " + Object.keys(window.PAGE_DATA).length + "</h2>";
        var b64 = window.PAGE_DATA["mavi-disi-kaplin.html"];
        if (b64) {
            document.body.innerHTML += "<h2>Found b64, decoding...</h2>";
            var decoded = atob(b64);
            document.body.innerHTML += "<h2>atob success, length: " + decoded.length + "</h2>";
            var raw = decodeURIComponent(escape(decoded));
            document.body.innerHTML += "<h2>decodeURIComponent success, length: " + raw.length + "</h2>";
        }
    } else {
        document.body.innerHTML += "<h1 style='color:red'>PAGE_DATA is missing!</h1>";
    }
} catch(e) {
    document.body.innerHTML += "<h1 style='color:red'>CATCH: " + e.message + "</h1>";
}
</script>
</head>

</html>
