  <script>
document.addEventListener('DOMContentLoaded', function() {
    var btnDesktop = document.getElementById('menuToggleDesktop');
    var btnMobile = document.getElementById('menuToggleMobile');
    var menuContainer = document.getElementById('mainMenuContainer');
    
    function toggleMenu(e) {
        if(e) e.preventDefault();
        if(menuContainer) {
            menuContainer.classList.toggle('active');
            if(menuContainer.classList.contains('active')) {
                menuContainer.style.display = 'block';
                menuContainer.style.zIndex = '99999';
            } else {
                menuContainer.style.display = 'none';
            }
        }
    }

    if(btnDesktop) {
        btnDesktop.addEventListener('click', toggleMenu);
    }
    if(btnMobile) {
        btnMobile.addEventListener('click', toggleMenu);
    }
});
</script>

<script id="baysu-mega-menu-js">
(function(){
    function initBaysuMenu() {
        var triggers = document.querySelectorAll('#menuToggleDesktop, #menuToggleMobile, .dropdown-toggle, a[href*="#products"]');
        var menu = document.getElementById('mainMenuContainer');

        if(!menu) return;

        triggers.forEach(function(btn){
            btn.addEventListener('click', function(e){
                e.preventDefault();
                e.stopPropagation();
                if(menu.classList.contains('active')) {
                    menu.classList.remove('active');
                } else {
                    menu.classList.add('active');
                }
            });
        });

        // Close menu when clicking outside
        document.addEventListener('click', function(e){
            if(menu && menu.classList.contains('active')) {
                var isClickInside = menu.contains(e.target);
                var isClickTrigger = false;
                triggers.forEach(function(btn){
                    if(btn.contains(e.target)) isClickTrigger = true;
                });

                if(!isClickInside && !isClickTrigger) {
                    menu.classList.remove('active');
                }
            }
        });
    }

    if(document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', initBaysuMenu);
    } else {
        initBaysuMenu();
    }
})();
</script>
